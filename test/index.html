<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>hetmule – test</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 52rem; padding: 0 1rem; color: #1f1f1f; }
    h2 { margin: 2rem 0 0.25rem; font-size: 1.15rem; }
    .intro { margin: 0 0 0.75rem; color: #555; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 0.5rem 0.75rem; border-left: 4px solid #ccc; margin-bottom: 0.4rem; background: #f7f7f7; }
    li.ok { border-color: #137333; }
    li.fel { border-color: #b3261e; background: #fdeceb; }
    .namn { font-weight: 600; }
    .ok .namn::before { content: '✓ '; color: #137333; }
    .fel .namn::before { content: '✗ '; color: #b3261e; }
    .beskrivning { margin: 0.2rem 0 0; color: #444; }
    .felmeddelande { margin: 0.3rem 0 0; color: #b3261e; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
    #summa { font-size: 1.1rem; font-weight: 600; }
    #sandbox { display: none; }
    code { font-family: ui-monospace, monospace; font-size: 0.92em; background: #ececec; padding: 0 0.25em; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>hetmule – test</h1>
  <p>Den här sidan kör alla tester för <code>hetmule.js</code> direkt i webbläsaren. Varje test har en kort förklaring av vad som kontrolleras och varför det spelar roll. Nätverkstesterna kräver att sidan öppnas via en webbserver, t.ex. <code>http://localhost:8888/hetmule/test/</code>.</p>
  <p id="summa">Kör…</p>
  <div id="resultat"></div>
  <div id="sandbox"></div>

  <script src="../hetmule.js"></script>
  <script>
  (async function () {

    // Ett test har ett namn, en förklaring och en funktion som kastar ett fel om något är fel.
    // Testerna samlas i grupper med en kort introduktion.
    const grupper = [];
    const grupp = (titel, intro) => grupper.push({ titel, intro, tests: [] });
    const test = (namn, beskrivning, fn) => grupper[grupper.length - 1].tests.push({ namn, beskrivning, fn });

    const eq = (a, b, msg) => {
      const sa = JSON.stringify(a), sb = JSON.stringify(b);
      if (sa !== sb) throw new Error((msg ? msg + ': ' : '') + 'väntade ' + sb + ', fick ' + sa);
    };
    const ok = (v, msg) => { if (!v) throw new Error(msg || 'inte sant'); };
    const vanta = ms => new Promise(r => setTimeout(r, ms));
    const sandbox = document.getElementById('sandbox');
    const SVG = 'http://www.w3.org/2000/svg';


    grupp('Bygga dom', 'H.el och H.svg skapar element utan innerHTML. H.mount sätter in dem på sidan och H.on lyssnar på händelser. Det är grunden för att slippa bygga html som strängar i js-koden.');

    test('el: tagg, klass och barn',
      'Ett element kan få klasser som lista och barn av olika slag: element, strängar, tal och listor, även nästlade. null och false hoppas över, så att villkor som "visa && H.el(...)" fungerar direkt.',
      () => {
        const n = H.el('div', { class: ['a', null, false && 'c', 'b'] }, 'hej ', H.el('b', 'du'), 0, null, false, [' x', [' y']]);
        eq(n.outerHTML, '<div class="a b">hej <b>du</b>0 x y</div>');
      });

    test('el: utan props',
      'Props-objektet är valfritt. Om andra argumentet inte är ett vanligt objekt räknas det som innehåll, så att H.el("p", "text") räcker för enkla fall.',
      () => {
        eq(H.el('p', 'text').outerHTML, '<p>text</p>');
        eq(H.el('br').outerHTML, '<br>');
      });

    test('el: 0 och tom sträng blir text',
      'Talet 0 och den tomma strängen är riktigt innehåll och ska bli textnoder, inte försvinna som om de vore false.',
      () => {
        eq(H.el('span', 0).textContent, '0');
        eq(H.el('span', '').childNodes.length, 1);
      });

    test('el: text är aldrig html',
      'Strängar blir alltid text. Om data från en användare eller server innehåller html-taggar visas de som tecken, så att ingen kan smuggla in egen kod. Det är den stora fördelen jämfört med innerHTML.',
      () => {
        const n = H.el('p', '<img src=x onerror=alert(1)>', '<b>x</b>');
        eq(n.children.length, 0);
        eq(n.textContent, '<img src=x onerror=alert(1)><b>x</b>');
      });

    test('el: attribut, även data- och aria-',
      'Allt som inte är class, style, value/checked/selected eller en händelse blir ett vanligt attribut, med samma namn som i html. Då behövs inga specialfall för data-* och aria-*.',
      () => {
        const n = H.el('a', { href: '?sida=om', 'data-id': 7, 'aria-label': 'Om oss' });
        eq([n.getAttribute('href'), n.dataset.id, n.getAttribute('aria-label')], ['?sida=om', '7', 'Om oss']);
      });

    test('el: booleska attribut',
      'disabled: false ska ge en knapp som går att klicka på. Med setAttribute blir det disabled="false", och då är knappen ändå avstängd. Här sätts attributet bara när värdet är sant, och null/undefined hoppas också över.',
      () => {
        eq(H.el('button', { disabled: false }).disabled, false);
        eq(H.el('button', { disabled: true }).disabled, true);
        eq(H.el('div', { hidden: true, title: null }).outerHTML, '<div hidden=""></div>');
      });

    test('el: style som sträng och objekt',
      'Stil kan anges som en css-sträng eller som ett objekt. Objektet klarar camelCase (fontSize), bindestreck (font-size) och css-variabler (--bredd).',
      () => {
        const n = H.el('div', { style: { color: 'red', fontSize: '12px', 'margin-top': '2px', '--bredd': '3' } });
        eq([n.style.color, n.style.fontSize, n.style.marginTop, n.style.getPropertyValue('--bredd')], ['red', '12px', '2px', '3']);
        eq(H.el('div', { style: 'color: blue' }).style.color, 'blue');
      });

    test('el: händelser',
      'En funktion på en nyckel som börjar med on blir en riktig addEventListener, inte en sträng i ett attribut. Namnet görs om till gemener, så onclick och onClick fungerar båda.',
      () => {
        let a = 0, b = 0;
        const n = H.el('button', { onclick: () => a++, onClick: () => b++ });
        n.click();
        eq([a, b], [1, 1]);
        eq(n.hasAttribute('onclick'), false);
      });

    test('el: value och checked som egenskaper',
      'value, checked och selected sätts som egenskaper på elementet, inte som attribut. Annars syns inte värdet i fältet efter att användaren har ändrat något.',
      () => {
        eq(H.el('input', { value: 'abc' }).value, 'abc');
        eq(H.el('input', { type: 'checkbox', checked: true }).checked, true);
      });

    test('el: value på select sätts efter options',
      'En select kan bara få ett värde som finns bland dess options. Därför läggs barnen till först och value sätts sist, annars hamnar valet på fel option.',
      () => {
        const s = H.el('select', { value: 'b' }, ['a', 'b'].map(v => H.el('option', { value: v }, v.toUpperCase())));
        eq(s.value, 'b');
      });

    test('el: props-objektet ändras inte',
      'Samma props-objekt ska kunna användas flera gånger, t.ex. i en loop, och ge samma resultat varje gång.',
      () => {
        const props = { class: 'k', title: 't' };
        const a = H.el('p', props), b = H.el('p', props);
        eq(props, { class: 'k', title: 't' });
        eq(a.outerHTML, b.outerHTML);
      });

    test('svg: namnrymd och klass',
      'SVG-element måste skapas i SVG-namnrymden, annars ritas de inte. H.svg sköter det, och class fungerar likadant som i H.el.',
      () => {
        const s = H.svg('svg', { viewBox: '0 0 10 10', class: 'ikon' }, H.svg('circle', { r: 5 }));
        eq([s.namespaceURI, s.firstChild.namespaceURI, s.getAttribute('class')], [SVG, SVG, 'ikon']);
      });

    test('mount: ersätter innehållet',
      'H.mount ersätter allt innehåll i ett element och tar samma sorters barn som H.el. Målet kan vara ett element eller en css-selektor. Utan barn tömmer den elementet. För att lägga till något sist räcker det inbyggda element.append().',
      () => {
        H.mount(sandbox, H.el('p', 'a'), ['b', null, 'c']);
        eq(sandbox.innerHTML, '<p>a</p>bc');
        H.mount('#sandbox', 'ny');
        eq(sandbox.innerHTML, 'ny');
        H.mount(sandbox);
        eq(sandbox.childNodes.length, 0);
      });

    test('on: delegering för element som skapas senare',
      'H.on lyssnar på en förälder och reagerar när man klickar på ett barn som matchar selektorn, även på element som ritas om efteråt. Det passar stora tabeller, där en lyssnare per cell blir många. Klick på ett inre element, här ett span i knappen, räknas till knappen. Funktionen som returneras tar bort lyssnaren.',
      () => {
        let traff = null;
        const sluta = H.on(sandbox, 'click', '.knapp', (e, el) => { traff = el.dataset.id; });
        H.mount(sandbox, H.el('button', { class: 'knapp', 'data-id': '7' }, H.el('span', 'x')));
        sandbox.querySelector('span').click();
        eq(traff, '7');
        sluta(); traff = null;
        sandbox.querySelector('span').click();
        eq(traff, null);
        H.mount(sandbox);
      });


    grupp('Dom från data', 'Sökvägar i objekt, mallar med {platshållare} och dom byggd från strukturer som kan ligga i json- eller yaml-filer, som sidorna i promisi.');

    test('get och set',
      'H.get hämtar ett värde med en sökväg som "a.b.c" och ger ett reservvärde om något led saknas, i stället för att krascha. H.set skapar de objekt som saknas på vägen. Siffror i sökvägen fungerar för listor.',
      () => {
        const o = {};
        H.set(o, 'a.b.c', 3);
        eq(o, { a: { b: { c: 3 } } });
        eq(H.get(o, 'a.b.c'), 3);
        eq(H.get(o, 'a.x.c', 'saknas'), 'saknas');
        eq(H.get({ l: [10, 20] }, 'l.1'), 20);
        eq(H.get({ n: 0 }, 'n', 5), 0, 'falska värden som 0 ska inte ersättas');
      });

    test('fill',
      'H.fill byter ut {sökväg} i en text mot värden ur data. Saknade värden lämnas kvar som {sökväg}, så att felet syns på sidan i stället för att bli tomt.',
      () => {
        eq(H.fill('{fnamn} {enamn}.', { fnamn: 'Ada', enamn: 'L' }), 'Ada L.');
        eq(H.fill('Hej {person.namn}', {}), 'Hej {person.namn}');
        eq(H.fill('{n} st', { n: 0 }), '0 st');
      });

    test('build: från data',
      'H.build bygger dom från listor på formen [tagg, props, ...barn]. Med data fylls platshållare i både texter och attribut.',
      () => {
        const spec = ['ul', { class: 'lista {typ}' }, ['li', 'Hej {namn}'], ['li', { 'data-id': '{id}' }, 'två']];
        const n = H.build(spec, { namn: 'Bo', typ: 'x', id: 5 });
        eq(n.outerHTML, '<ul class="lista x"><li>Hej Bo</li><li data-id="5">två</li></ul>');
      });

    test('build: lista med noder och text',
      'En lista som inte börjar med ett taggnamn är flera noder bredvid varandra, som en hel sida. Resultatet kan skickas direkt till H.mount.',
      () => {
        H.mount(sandbox, H.build([['h1', 'Rubrik'], 'text', ['p', 'stycke']]));
        eq(sandbox.innerHTML, '<h1>Rubrik</h1>text<p>stycke</p>');
        H.mount(sandbox);
      });

    test('build: svg-barn får rätt namnrymd',
      'Allt som ligger inuti en svg i datastrukturen ska skapas som SVG, även flera nivåer ned. Annars syns inte grafiken.',
      () => {
        const n = H.build(['svg', { viewBox: '0 0 1 1' }, ['g', ['path', { d: 'M0 0' }]]]);
        eq(n.querySelector('path').namespaceURI, SVG);
      });


    grupp('Adressfältet', 'Läsa och skriva get-parametrar, så att en vy går att länka till och ladda om. Mandatkollen sparar t.ex. filter och sortering där.');

    test('params: läsa och skriva',
      'H.params(värden) skriver till adressfältet utan att ladda om sidan, och H.params() läser tillbaka. En lista blir en upprepad nyckel och läses tillbaka som lista, t.ex. flera filtervärden. Tomma värden hoppas över så att adressen hålls kort, och true blir 1.',
      () => {
        const fore = location.href;
        H.params({ a: 1, tom: '', nej: false, ja: true, f: ['x', 'y'], n: null });
        eq(location.search, '?a=1&ja=1&f=x&f=y');
        eq(H.params(), { a: '1', ja: '1', f: ['x', 'y'] });
        history.replaceState(null, '', fore);
      });

    test('params: historiepunkt',
      'Med push som andra argument skapas en ny historiepunkt, så att bakåtknappen går tillbaka till föregående adress. Utan push skrivs den nuvarande över.',
      async () => {
        const fore = location.href;
        const langd = history.length;
        H.params({ steg: 1 });
        eq(history.length, langd, 'utan push ska historiken inte växa');
        H.params({ steg: 2 }, true);
        eq(history.length, langd + 1);
        history.back();
        await vanta(100);
        eq(H.params(), { steg: '1' });
        history.replaceState(null, '', fore);
      });


    grupp('Sidor', 'H.router byter "sida" i en single page application, håller adressfältet i takt och får bakåtknappen att fungera.');

    test('router: start, länkar och tillbaka',
      'Vid start visas startsidan och adressen får ?sida=start, plus de extra parametrar som params ger. Ett klick på en vanlig länk till ?sida=om visar den sidan utan att ladda om och skapar en historiepunkt. Länken fungerar fortfarande att öppna i en ny flik. history.back(), alltså bakåtknappen, visar startsidan igen. render ska anropas exakt en gång per sidbyte.',
      async () => {
        const fore = location.href;
        const ritat = [];
        const router = H.router({
          param: 'sida',
          start: 'start',
          params: () => ({ extra: 'x' }),
          render: sida => {
            ritat.push(sida);
            H.mount(sandbox, H.el('a', { href: '?sida=om' }, 'Om'));
          }
        });
        await vanta(0);
        eq(router.current, 'start');
        eq(H.params(), { sida: 'start', extra: 'x' });
        eq(router.url('om'), location.pathname + '?sida=om&extra=x', 'router.url ger en färdig länk');

        sandbox.querySelector('a').click();
        await vanta(0);
        eq(router.current, 'om');
        eq(H.params().sida, 'om');

        history.back();
        await vanta(100);
        eq(router.current, 'start');
        eq(ritat, ['start', 'om', 'start']);

        history.replaceState(null, '', fore);
        H.mount(sandbox);
      });


    grupp('Hjälpfunktioner', 'Små verktyg som behövs i de flesta projekt.');

    test('debounce',
      'H.debounce väntar tills anropen har slutat komma innan funktionen körs, och skickar med de senaste argumenten. Tre snabba anrop ska ge en körning. Det används t.ex. i sökfält, så att man inte söker vid varje tangenttryckning.',
      async () => {
        const fick = [];
        const f = H.debounce(v => fick.push(v), 20);
        f(1); f(2); f(3);
        await vanta(60);
        eq(fick, [3]);
      });


    grupp('Kö', 'H.queue kör en tung funktion på många poster i små portioner, så att sidan går att använda under tiden. Det är så mandatkollen räknar alla val genom valsimulatorn.');

    test('queue: alla poster, i ordning, med progress',
      'Alla poster ska behandlas, resultaten ska komma i samma ordning som posterna och funktionen ska få postens index. onProgress rapporterar hur många som är klara, sist 4 av 4.',
      async () => {
        const steg = [];
        const r = await H.queue([1, 2, 3, 4], (x, i) => x * 10 + i, { onProgress: (k, t) => steg.push([k, t]) });
        eq(r, [10, 21, 32, 43]);
        eq(steg[steg.length - 1], [4, 4]);
      });

    test('queue: släpper fram webbläsaren mellan portionerna',
      '30 poster som tar 2 ms vardera ska delas upp i flera portioner om ungefär 12 ms. Mellan portionerna hinner webbläsaren rita och svara på klick.',
      async () => {
        let portioner = 0;
        await H.queue(new Array(30).fill(0), () => { const t = Date.now(); while (Date.now() - t < 2); }, { onProgress: () => portioner++ });
        ok(portioner >= 3, 'bara ' + portioner + ' portioner');
      });

    test('queue: tom lista och avbrott',
      'En tom lista ska ge ett tomt resultat. En lång kö ska gå att avbryta med en AbortController, t.ex. om ny data kommer in mitt i en beräkning. Då avvisas promiset.',
      async () => {
        eq(await H.queue([], x => x), []);
        const ctrl = new AbortController();
        const p = H.queue(new Array(1000).fill(0), () => { const t = Date.now(); while (Date.now() - t < 1); }, { signal: ctrl.signal });
        setTimeout(() => ctrl.abort(), 30);
        let avbruten = false;
        try { await p; } catch (e) { avbruten = true; }
        ok(avbruten, 'kön avbröts inte');
      });

    test('queue: fel i funktionen avvisar',
      'Om funktionen kastar ett fel ska kön stanna och felet komma fram via promiset, så att det går att fånga med try/catch.',
      async () => {
        let fel = null;
        try { await H.queue([1], () => { throw new Error('pang'); }); } catch (e) { fel = e.message; }
        eq(fel, 'pang');
      });


    grupp('Polling', 'H.poll kör en funktion när man vill eller med jämna mellanrum, och reagerar bara när svaret har ändrats. Det är samma sak som auto-refresh av allt.json i mandatkollen.');

    test('poll: onChange bara vid ändring',
      'Första svaret räknas som en ändring, så samma kod kan sköta både första laddningen och uppdateringar. Ett likadant svar ger ingen ändring. När värdet ändras får onChange både det nya och det förra värdet.',
      async () => {
        let v = { n: 1 }; const andringar = [];
        const p = H.poll(() => v, { onChange: (ny, gammal) => andringar.push([ny, gammal]) });
        eq(await p.check(), true);
        v = { n: 1 };
        eq(await p.check(), false, 'samma innehåll i ett nytt objekt är ingen ändring');
        v = { n: 2 };
        eq(await p.check(), true);
        eq(andringar, [[{ n: 1 }, undefined], [{ n: 2 }, { n: 1 }]]);
      });

    test('poll: start och stop',
      'start kör kontrollen med jämna mellanrum och stop avbryter. Efter stop ska inga fler kontroller göras. Det motsvarar kryssrutan "Auto-refresh".',
      async () => {
        let n = 0;
        const p = H.poll(() => n++, { every: 15 }).start();
        ok(p.running);
        await vanta(70);
        p.stop();
        ok(!p.running);
        const efter = n;
        ok(efter >= 2, 'bara ' + efter + ' kontroller');
        await vanta(40);
        eq(n, efter, 'fortsatte efter stop');
      });

    test('poll: fel går till onError och nästa kontroll fungerar',
      'Ett fel, t.ex. att servern inte svarar, ska gå till onError och inte krascha sidan. Nästa kontroll ska köras som vanligt, även när felet kastas direkt.',
      async () => {
        let fel = null, kasta = true;
        const p = H.poll(() => { if (kasta) throw new Error('nej'); return 1; }, { onError: e => { fel = e.message; } });
        eq(await p.check(), false); eq(fel, 'nej');
        kasta = false;
        eq(await p.check(), true);
      });

    test('poll: en kontroll i taget',
      'Om man klickar "Kontrollera nu" medan en kontroll pågår ska ingen ny startas. Man får samma pågående kontroll tillbaka.',
      async () => {
        let n = 0;
        const p = H.poll(async () => { n++; await vanta(20); return n; });
        await Promise.all([p.check(), p.check(), p.check()]);
        eq(n, 1);
      });


    const viaHttp = location.protocol.startsWith('http');

    grupp('Nätverk', viaHttp
      ? 'Hämtar test/data.json och andra filer från webbservern.'
      : 'Hoppas över, eftersom sidan är öppnad som fil. Öppna den via en webbserver för att köra de här testerna.');

    if (viaHttp) {
      test('request: formatet avgörs av svaret',
        'Utan as väljer H.request format efter serverns Content-Type: json blir data och html blir text. .yaml/.yml läses med js-yaml. Med as kan man bestämma själv.',
        async () => {
          eq((await H.request('data.json')).namn, 'hetmule');
          ok((await H.request('index.html')).includes('<html'));
          ok((await H.request('data.json', { as: 'text' })).startsWith('{'));
        });

      test('request: 404 kastar fel',
        'Ett svar som inte är ok, som 404 eller 500, ska ge ett fel som innehåller svaret. Det ska inte gå vidare som om allt gick bra. fetch gör inte det av sig själv.',
        async () => {
          let fel = null;
          try { await H.request('finns-inte.json'); } catch (e) { fel = e.response && e.response.status; }
          eq(fel, 404);
        });

      test('request: HEAD ger response',
        'Ett HEAD-svar har ingen body. Därför ger HEAD tillbaka själva svaret, så att man kan se om filen finns utan att hämta den.',
        async () => {
          const r = await H.request('data.json', { method: 'HEAD' });
          eq(r.ok, true);
        });

      test('poll + request: bevaka en fil',
        'H.poll och H.request tillsammans bevakar en fil på servern. bust gör att filen hämtas på nytt varje gång, i stället för från webbläsarens cache.',
        async () => {
          let fick = null;
          const p = H.poll(() => H.request('data.json', { bust: true }), { onChange: d => { fick = d.namn; } });
          eq(await p.check(), true); eq(fick, 'hetmule');
          eq(await p.check(), false);
        });
    }


    // ── Kör alla tester och visa resultatet ──

    let antal = 0, fel = 0;

    for (const g of grupper) {
      const lista = H.el('ul');
      document.getElementById('resultat').append(H.el('h2', g.titel), H.el('p', { class: 'intro' }, g.intro), lista);

      for (const t of g.tests) {
        antal++;
        let felmeddelande = null;
        try {
          await t.fn();
        } catch (e) {
          fel++;
          felmeddelande = e.message;
          console.error(t.namn, e);
        }
        lista.append(H.el('li', { class: felmeddelande ? 'fel' : 'ok' },
          H.el('div', { class: 'namn' }, t.namn),
          H.el('p', { class: 'beskrivning' }, t.beskrivning),
          felmeddelande && H.el('p', { class: 'felmeddelande' }, felmeddelande)
        ));
      }
    }

    const summa = (antal - fel) + ' av ' + antal + ' ok' + (viaHttp ? '' : ' (nätverkstesterna hoppades över – öppna sidan via en webbserver)');
    H.mount('#summa', summa);
    document.title = (fel ? 'FEL ' : 'OK ') + summa;
  })();
  </script>
</body>
</html>
