<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>hetmule – tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 52rem; padding: 0 1rem; color: #1f1f1f; }
    h2 { margin: 2rem 0 0.25rem; font-size: 1.15rem; }
    .intro { margin: 0 0 0.75rem; color: #555; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 0.5rem 0.75rem; border-left: 4px solid #ccc; margin-bottom: 0.4rem; background: #f7f7f7; }
    li.pass { border-color: #137333; }
    li.fail { border-color: #b3261e; background: #fdeceb; }
    .name { font-weight: 600; }
    .pass .name::before { content: '✓ '; color: #137333; }
    .fail .name::before { content: '✗ '; color: #b3261e; }
    .description { margin: 0.2rem 0 0; color: #444; }
    .error { margin: 0.3rem 0 0; color: #b3261e; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
    #summary { font-size: 1.1rem; font-weight: 600; }
    #sandbox { display: none; }
    code { font-family: ui-monospace, monospace; font-size: 0.92em; background: #ececec; padding: 0 0.25em; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>hetmule – tests</h1>
  <p>This page runs all tests for <code>hetmule.js</code> directly in the browser. Each test has a short explanation of what it checks and why it matters. The network tests require the page to be opened through a web server, e.g. <code>http://localhost:8888/hetmule/test/</code>.</p>
  <p id="summary">Running…</p>
  <div id="results"></div>
  <div id="sandbox"></div>

  <script src="../hetmule.js"></script>
  <script>
  (async function () {

    // A test has a name, an explanation and a function that throws if something is wrong.
    // Tests are collected in groups with a short introduction.
    const groups = [];
    const group = (title, intro) => groups.push({ title, intro, tests: [] });
    const test = (name, description, fn) => groups[groups.length - 1].tests.push({ name, description, fn });

    const eq = (a, b, msg) => {
      const sa = JSON.stringify(a), sb = JSON.stringify(b);
      if (sa !== sb) throw new Error((msg ? msg + ': ' : '') + 'expected ' + sb + ', got ' + sa);
    };
    const ok = (v, msg) => { if (!v) throw new Error(msg || 'not true'); };
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const sandbox = document.getElementById('sandbox');
    const SVG = 'http://www.w3.org/2000/svg';


    group('Building dom', 'H.el and H.svg create elements without innerHTML. H.mount puts them on the page and H.on listens to events. This is the foundation for not building html as strings in js code.');

    test('el: tag, class and children',
      'An element can get classes as an array and children of different kinds: elements, strings, numbers and arrays, even nested ones. null and false are skipped, so conditions like "show && H.el(...)" work directly.',
      () => {
        const n = H.el('div', { class: ['a', null, false && 'c', 'b'] }, 'hi ', H.el('b', 'you'), 0, null, false, [' x', [' y']]);
        eq(n.outerHTML, '<div class="a b">hi <b>you</b>0 x y</div>');
      });

    test('el: without props',
      'The props object is optional. If the second argument isn\'t a plain object it counts as content, so H.el("p", "text") is enough for simple cases.',
      () => {
        eq(H.el('p', 'text').outerHTML, '<p>text</p>');
        eq(H.el('br').outerHTML, '<br>');
      });

    test('el: 0 and the empty string become text',
      'The number 0 and the empty string are real content and should become text nodes, not disappear as if they were false.',
      () => {
        eq(H.el('span', 0).textContent, '0');
        eq(H.el('span', '').childNodes.length, 1);
      });

    test('el: text is never html',
      'Strings always become text. If data from a user or server contains html tags, they are shown as characters, so nobody can sneak in their own code. This is the big advantage over innerHTML.',
      () => {
        const n = H.el('p', '<img src=x onerror=alert(1)>', '<b>x</b>');
        eq(n.children.length, 0);
        eq(n.textContent, '<img src=x onerror=alert(1)><b>x</b>');
      });

    test('el: attributes, including data- and aria-',
      'Everything that isn\'t class, style, value/checked/selected or an event becomes a plain attribute, named as in html. No special cases are needed for data-* and aria-*.',
      () => {
        const n = H.el('a', { href: '?page=about', 'data-id': 7, 'aria-label': 'About us' });
        eq([n.getAttribute('href'), n.dataset.id, n.getAttribute('aria-label')], ['?page=about', '7', 'About us']);
      });

    test('el: boolean attributes',
      'disabled: false should give a clickable button. With setAttribute it becomes disabled="false", and the button is disabled anyway. Here the attribute is only set when the value is true, and null/undefined are skipped too.',
      () => {
        eq(H.el('button', { disabled: false }).disabled, false);
        eq(H.el('button', { disabled: true }).disabled, true);
        eq(H.el('div', { hidden: true, title: null }).outerHTML, '<div hidden=""></div>');
      });

    test('el: style as string and object',
      'Style can be a css string or an object. The object handles camelCase (fontSize), hyphens (font-size) and css variables (--width).',
      () => {
        const n = H.el('div', { style: { color: 'red', fontSize: '12px', 'margin-top': '2px', '--width': '3' } });
        eq([n.style.color, n.style.fontSize, n.style.marginTop, n.style.getPropertyValue('--width')], ['red', '12px', '2px', '3']);
        eq(H.el('div', { style: 'color: blue' }).style.color, 'blue');
      });

    test('el: events',
      'A function on a key starting with on becomes a real addEventListener, not a string in an attribute. The name is lowercased, so both onclick and onClick work.',
      () => {
        let a = 0, b = 0;
        const n = H.el('button', { onclick: () => a++, onClick: () => b++ });
        n.click();
        eq([a, b], [1, 1]);
        eq(n.hasAttribute('onclick'), false);
      });

    test('el: value and checked as properties',
      'value, checked and selected are set as properties on the element, not as attributes. Otherwise the value isn\'t shown in the field after the user has changed something.',
      () => {
        eq(H.el('input', { value: 'abc' }).value, 'abc');
        eq(H.el('input', { type: 'checkbox', checked: true }).checked, true);
      });

    test('el: value on select is set after the options',
      'A select can only take a value that exists among its options. So the children are added first and value is set last, otherwise the wrong option is selected.',
      () => {
        const s = H.el('select', { value: 'b' }, ['a', 'b'].map(v => H.el('option', { value: v }, v.toUpperCase())));
        eq(s.value, 'b');
      });

    test('el: the props object is not changed',
      'The same props object should be reusable, e.g. in a loop, and give the same result every time.',
      () => {
        const props = { class: 'k', title: 't' };
        const a = H.el('p', props), b = H.el('p', props);
        eq(props, { class: 'k', title: 't' });
        eq(a.outerHTML, b.outerHTML);
      });

    test('svg: namespace and class',
      'SVG elements must be created in the SVG namespace, otherwise they aren\'t drawn. H.svg takes care of that, and class works the same as in H.el.',
      () => {
        const s = H.svg('svg', { viewBox: '0 0 10 10', class: 'icon' }, H.svg('circle', { r: 5 }));
        eq([s.namespaceURI, s.firstChild.namespaceURI, s.getAttribute('class')], [SVG, SVG, 'icon']);
      });

    test('mount: replaces the content',
      'H.mount replaces all content of an element and takes the same kinds of children as H.el. The target can be an element or a css selector. Without children it empties the element.',
      () => {
        H.mount(sandbox, H.el('p', 'a'), ['b', null, 'c']);
        eq(sandbox.innerHTML, '<p>a</p>bc');
        H.mount('#sandbox', 'new');
        eq(sandbox.innerHTML, 'new');
        H.mount(sandbox);
        eq(sandbox.childNodes.length, 0);
      });

    test('inserting elsewhere: the browser\'s own methods',
      'H.el returns an ordinary element, so append, prepend, before, after and replaceWith place it anywhere. That is why hetmule has no functions of its own for it.',
      () => {
        const middle = H.el('li', 'b');
        H.mount(sandbox, H.el('ul', middle));
        middle.before(H.el('li', 'a'));
        middle.after(H.el('li', 'c'));
        sandbox.firstChild.prepend(H.el('li', 'first'));
        sandbox.firstChild.append(H.el('li', 'last'));
        middle.replaceWith(H.el('li', 'B'));
        eq(sandbox.textContent, 'firstaBclast');
        H.mount(sandbox);
      });

    test('on: delegation for elements created later',
      'H.on listens on a parent and reacts when you click a child matching the selector, even elements drawn afterwards. Good for big tables, where one listener per cell adds up. A click on an inner element, here a span inside the button, counts as the button. The returned function removes the listener.',
      () => {
        let hit = null;
        const stop = H.on(sandbox, 'click', '.button', (e, el) => { hit = el.dataset.id; });
        H.mount(sandbox, H.el('button', { class: 'button', 'data-id': '7' }, H.el('span', 'x')));
        sandbox.querySelector('span').click();
        eq(hit, '7');
        stop(); hit = null;
        sandbox.querySelector('span').click();
        eq(hit, null);
        H.mount(sandbox);
      });


    group('Dom from data', 'Paths in objects, templates with {placeholders} and dom built from structures that can live in json or yaml files, like the pages in promisi.');

    test('get and set',
      'H.get reads a value with a path like "a.b.c" and returns a fallback if any step is missing, instead of crashing. H.set creates the objects missing along the way. Numbers in the path work for arrays.',
      () => {
        const o = {};
        H.set(o, 'a.b.c', 3);
        eq(o, { a: { b: { c: 3 } } });
        eq(H.get(o, 'a.b.c'), 3);
        eq(H.get(o, 'a.x.c', 'missing'), 'missing');
        eq(H.get({ l: [10, 20] }, 'l.1'), 20);
        eq(H.get({ n: 0 }, 'n', 5), 0, 'falsy values like 0 should not be replaced');
      });

    test('fill',
      'H.fill replaces {path} in a text with values from data. Missing values are left as {path}, so the mistake shows on the page instead of going blank.',
      () => {
        eq(H.fill('{first} {last}.', { first: 'Ada', last: 'L' }), 'Ada L.');
        eq(H.fill('Hello {person.name}', {}), 'Hello {person.name}');
        eq(H.fill('{n} pcs', { n: 0 }), '0 pcs');
      });

    test('build: from data',
      'H.build builds dom from arrays of the form [tag, props, ...children]. With data, placeholders are filled in both text and attributes.',
      () => {
        const spec = ['ul', { class: 'list {type}' }, ['li', 'Hello {name}'], ['li', { 'data-id': '{id}' }, 'two']];
        const n = H.build(spec, { name: 'Bo', type: 'x', id: 5 });
        eq(n.outerHTML, '<ul class="list x"><li>Hello Bo</li><li data-id="5">two</li></ul>');
      });

    test('build: a list of nodes and text',
      'An array that doesn\'t start with a tag name is several sibling nodes, like a whole page. The result can be passed straight to H.mount.',
      () => {
        H.mount(sandbox, H.build([['h1', 'Heading'], 'text', ['p', 'paragraph']]));
        eq(sandbox.innerHTML, '<h1>Heading</h1>text<p>paragraph</p>');
        H.mount(sandbox);
      });

    test('build: svg children get the right namespace',
      'Everything inside an svg in the data structure should be created as SVG, even several levels down. Otherwise the graphics don\'t show.',
      () => {
        const n = H.build(['svg', { viewBox: '0 0 1 1' }, ['g', ['path', { d: 'M0 0' }]]]);
        eq(n.querySelector('path').namespaceURI, SVG);
      });


    group('The address bar', 'Reading and writing query parameters, so a view can be linked to and reloaded. Mandatkollen, for example, keeps filters and sorting there.');

    test('params: read and write',
      'H.params(values) writes to the address bar without reloading, and H.params() reads it back. An array becomes a repeated key and is read back as an array, e.g. several filter values. Empty values are skipped to keep the address short, and true becomes 1.',
      () => {
        const before = location.href;
        H.params({ a: 1, empty: '', no: false, yes: true, f: ['x', 'y'], n: null });
        eq(location.search, '?a=1&yes=1&f=x&f=y');
        eq(H.params(), { a: '1', yes: '1', f: ['x', 'y'] });
        history.replaceState(null, '', before);
      });

    test('params: history entry',
      'With push as the second argument a new history entry is created, so the back button returns to the previous address. Without push the current one is overwritten.',
      async () => {
        const before = location.href;
        const length = history.length;
        H.params({ step: 1 });
        eq(history.length, length, 'without push the history should not grow');
        H.params({ step: 2 }, true);
        eq(history.length, length + 1);
        history.back();
        await wait(100);
        eq(H.params(), { step: '1' });
        history.replaceState(null, '', before);
      });


    group('Pages', 'H.router switches "pages" in a single page application, keeps the address bar in step and makes the back button work.');

    test('router: start, links and back',
      'On start the start page is shown and the address gets ?page=start, plus the extra parameters from params. A click on a plain link to ?page=about shows that page without reloading and creates a history entry. The link can still be opened in a new tab. history.back(), i.e. the back button, shows the start page again. render should be called exactly once per page switch.',
      async () => {
        const before = location.href;
        const rendered = [];
        const router = H.router({
          param: 'page',
          start: 'start',
          params: () => ({ extra: 'x' }),
          render: page => {
            rendered.push(page);
            H.mount(sandbox, H.el('a', { href: '?page=about' }, 'About'));
          }
        });
        await wait(0);
        eq(router.current, 'start');
        eq(H.params(), { page: 'start', extra: 'x' });
        eq(router.url('about'), location.pathname + '?page=about&extra=x', 'router.url gives a ready-made link');

        sandbox.querySelector('a').click();
        await wait(0);
        eq(router.current, 'about');
        eq(H.params().page, 'about');

        history.back();
        await wait(100);
        eq(router.current, 'start');
        eq(rendered, ['start', 'about', 'start']);

        history.replaceState(null, '', before);
        H.mount(sandbox);
      });


    group('Helpers', 'Small tools needed in most projects.');

    test('debounce',
      'H.debounce waits until the calls have stopped coming before running the function, and passes on the latest arguments. Three quick calls should give one run. Used e.g. in search fields, so you don\'t search on every keystroke.',
      async () => {
        const got = [];
        const f = H.debounce(v => got.push(v), 20);
        f(1); f(2); f(3);
        await wait(60);
        eq(got, [3]);
      });


    group('Queue', 'H.queue runs a heavy function on many items in small slices, so the page stays usable meanwhile. This is how mandatkollen runs every election through the simulator.');

    test('queue: all items, in order, with progress',
      'Every item should be processed, results should come in the same order as the items and the function should get the item\'s index. onProgress reports how many are done, finally 4 of 4.',
      async () => {
        const steps = [];
        const r = await H.queue([1, 2, 3, 4], (x, i) => x * 10 + i, { onProgress: (d, t) => steps.push([d, t]) });
        eq(r, [10, 21, 32, 43]);
        eq(steps[steps.length - 1], [4, 4]);
      });

    test('queue: lets the browser in between slices',
      '30 items taking 2 ms each should be split into several slices of about 12 ms. Between the slices the browser has time to draw and respond to clicks.',
      async () => {
        let slices = 0;
        await H.queue(new Array(30).fill(0), () => { const t = Date.now(); while (Date.now() - t < 2); }, { onProgress: () => slices++ });
        ok(slices >= 3, 'only ' + slices + ' slices');
      });

    test('queue: empty list and cancelling',
      'An empty list should give an empty result. A long queue should be cancellable with an AbortController, e.g. if new data arrives in the middle of a computation. The promise is then rejected.',
      async () => {
        eq(await H.queue([], x => x), []);
        const ctrl = new AbortController();
        const p = H.queue(new Array(1000).fill(0), () => { const t = Date.now(); while (Date.now() - t < 1); }, { signal: ctrl.signal });
        setTimeout(() => ctrl.abort(), 30);
        let cancelled = false;
        try { await p; } catch (e) { cancelled = true; }
        ok(cancelled, 'the queue was not cancelled');
      });

    test('queue: an error in the function rejects',
      'If the function throws, the queue should stop and the error should come through the promise, so it can be caught with try/catch.',
      async () => {
        let error = null;
        try { await H.queue([1], () => { throw new Error('bang'); }); } catch (e) { error = e.message; }
        eq(error, 'bang');
      });


    group('Polling', 'H.poll runs a function on demand or at intervals, and only reacts when the result has changed. The same thing as the auto-refresh of allt.json in mandatkollen.');

    test('poll: onChange only on change',
      'The first result counts as a change, so the same code can handle both the first load and updates. An identical result gives no change. When the value changes, onChange gets both the new and the previous value.',
      async () => {
        let v = { n: 1 }; const changes = [];
        const p = H.poll(() => v, { onChange: (next, previous) => changes.push([next, previous]) });
        eq(await p.check(), true);
        v = { n: 1 };
        eq(await p.check(), false, 'the same content in a new object is not a change');
        v = { n: 2 };
        eq(await p.check(), true);
        eq(changes, [[{ n: 1 }, undefined], [{ n: 2 }, { n: 1 }]]);
      });

    test('poll: start and stop',
      'start runs the check at intervals and stop ends it. After stop no more checks should run. This matches the "Auto-refresh" checkbox.',
      async () => {
        let n = 0;
        const p = H.poll(() => n++, { every: 15 }).start();
        ok(p.running);
        await wait(70);
        p.stop();
        ok(!p.running);
        const after = n;
        ok(after >= 2, 'only ' + after + ' checks');
        await wait(40);
        eq(n, after, 'continued after stop');
      });

    test('poll: errors go to onError and the next check works',
      'An error, e.g. the server not responding, should go to onError and not crash the page. The next check should run as usual, even when the error is thrown immediately.',
      async () => {
        let error = null, fail = true;
        const p = H.poll(() => { if (fail) throw new Error('no'); return 1; }, { onError: e => { error = e.message; } });
        eq(await p.check(), false); eq(error, 'no');
        fail = false;
        eq(await p.check(), true);
      });

    test('poll: one check at a time',
      'Clicking "Check now" while a check is running should not start a new one. You get the running check back.',
      async () => {
        let n = 0;
        const p = H.poll(async () => { n++; await wait(20); return n; });
        await Promise.all([p.check(), p.check(), p.check()]);
        eq(n, 1);
      });


    const overHttp = location.protocol.startsWith('http');

    group('Network', overHttp
      ? 'Fetches test/data.json and other files from the web server.'
      : 'Skipped, since the page is opened as a file. Open it through a web server to run these tests.');

    if (overHttp) {
      test('request: the format is decided by the response',
        'Without as, H.request picks the format from the server\'s Content-Type: json becomes data and html becomes text. .yaml/.yml is read with js-yaml. With as you decide yourself.',
        async () => {
          eq((await H.request('data.json')).name, 'hetmule');
          ok((await H.request('index.html')).includes('<html'));
          ok((await H.request('data.json', { as: 'text' })).startsWith('{'));
        });

      test('request: 404 throws',
        'A response that isn\'t ok, like 404 or 500, should give an error containing the response. It should not carry on as if everything went well. fetch doesn\'t do that by itself.',
        async () => {
          let status = null;
          try { await H.request('does-not-exist.json'); } catch (e) { status = e.response && e.response.status; }
          eq(status, 404);
        });

      test('request: HEAD returns the response',
        'A HEAD response has no body. So HEAD returns the response itself, to check whether a file exists without fetching it.',
        async () => {
          const r = await H.request('data.json', { method: 'HEAD' });
          eq(r.ok, true);
        });

      test('poll + request: watch a file',
        'H.poll and H.request together watch a file on the server. bust makes the file be fetched again every time, instead of from the browser\'s cache.',
        async () => {
          let got = null;
          const p = H.poll(() => H.request('data.json', { bust: true }), { onChange: d => { got = d.name; } });
          eq(await p.check(), true); eq(got, 'hetmule');
          eq(await p.check(), false);
        });
    }


    // ── Run all tests and show the results ──

    let count = 0, failed = 0;

    for (const g of groups) {
      const list = H.el('ul');
      document.getElementById('results').append(H.el('h2', g.title), H.el('p', { class: 'intro' }, g.intro), list);

      for (const t of g.tests) {
        count++;
        let error = null;
        try {
          await t.fn();
        } catch (e) {
          failed++;
          error = e.message;
          console.error(t.name, e);
        }
        list.append(H.el('li', { class: error ? 'fail' : 'pass' },
          H.el('div', { class: 'name' }, t.name),
          H.el('p', { class: 'description' }, t.description),
          error && H.el('p', { class: 'error' }, error)
        ));
      }
    }

    const summary = (count - failed) + ' of ' + count + ' passed' + (overHttp ? '' : ' (network tests skipped – open the page through a web server)');
    H.mount('#summary', summary);
    document.title = (failed ? 'FAIL ' : 'OK ') + summary;
  })();
  </script>
</body>
</html>
